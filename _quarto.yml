project:
  type: book
  output-dir: docs
  resources:
  - results/synthetic/figures/*.png
  - results/zackular/figures/*.png
book:
  title: AI-Assisted Microbiome Analysis with R
  subtitle: From microbiome data to an output you understand and can defend
  author: Teresia Mrema Buza | Complex Data Insights
  chapters:
  - index.qmd
  - part: Required setup and workflow
    chapters:
    - 00-setup.qmd
    - 01-run-the-workflow.qmd
    - 02-write-the-report.qmd
  - part: Synthetic practice
    chapters:
    - examples/synthetic/00-start-here.qmd
    - examples/synthetic/01-see-the-result.qmd
    - examples/synthetic/02-meet-the-data.qmd
    - examples/synthetic/03-check-the-inputs.qmd
    - examples/synthetic/04-run-the-analysis.qmd
    - examples/synthetic/05-verify-and-explain.qmd
    - examples/synthetic/06-export-the-report.qmd
  - part: 'Human stool study: Zackular'
    chapters:
    - examples/zackular/00-start-here.qmd
    - examples/zackular/01-see-the-result.qmd
    - examples/zackular/02-meet-the-data.qmd
    - examples/zackular/03-check-the-inputs.qmd
    - examples/zackular/04-run-the-analysis.qmd
    - examples/zackular/05-verify-and-explain.qmd
    - examples/zackular/06-export-the-report.qmd
  - part: Your own study
    chapters:
    - examples/my-study/00-start-here.qmd
    - examples/my-study/01-see-the-result.qmd
    - examples/my-study/02-meet-the-data.qmd
    - examples/my-study/03-check-the-inputs.qmd
    - examples/my-study/04-run-the-analysis.qmd
    - examples/my-study/05-verify-and-explain.qmd
    - examples/my-study/06-export-the-report.qmd
  appendices:
  - 99-appendix.qmd
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 2
    anchor-sections: true
    link-external-icon: true
    code-fold: false
    code-summary: Show code
    code-tools: false
    smooth-scroll: true
    mermaid:
      theme: forest
    css: assets/css/microbiome-guide.css
execute:
  echo: true
  eval: false
  warning: false
  message: false
  freeze: auto
  working-dir: .
