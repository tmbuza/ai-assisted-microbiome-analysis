project:
  type: book
  output-dir: docs
  resources:
  - "results/metagenomics/example/figures/*.png"
  - "results/metagenomics/my-study/figures/*.png"

date: 2026-10-14
date-format: "MMM YYYY"

book:
  title: "AI-Assisted Microbiome Analysis"
  subtitle: "From microbiome data to an output you understand and can defend"
  author: "Teresia Mrema Buza | Complex Data Insights"

  chapters:
    - index.qmd

    - part: "Explore the example"
      chapters:
        - examples/community-comparison/01-see-the-result.qmd
        - examples/community-comparison/example-report.qmd
        - examples/community-comparison/02-meet-the-data.qmd

    - part: "Prepare and analyse"
      chapters:
        - examples/community-comparison/03-check-the-inputs.qmd
        - examples/community-comparison/04-run-the-analysis.qmd

    - part: "Verify and share"
      chapters:
        - examples/community-comparison/05-verify-and-explain.qmd
        - examples/community-comparison/06-export-the-report.qmd

    - part: "Shotgun metagenomics"
      chapters:
        - examples/shotgun-metagenomics/00-start-here.qmd
        - examples/shotgun-metagenomics/01-see-the-result.qmd
        - examples/shotgun-metagenomics/02-meet-the-data.qmd
        - examples/shotgun-metagenomics/03-check-the-inputs.qmd
        - examples/shotgun-metagenomics/04-run-the-analysis.qmd
        - examples/shotgun-metagenomics/05-verify-and-explain.qmd
        - examples/shotgun-metagenomics/06-export-the-report.qmd

  appendices:
    - 00-preface.qmd
    - examples/community-comparison/00-start-here.qmd
    - examples/community-comparison/99-appendix.qmd


format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 2
    anchor-sections: true
    link-external-icon: true
    css: assets/css/cdi.css
    code-fold: true
    code-summary: "Show code"
    code-tools: false
    smooth-scroll: true
    mermaid:
      theme: forest

execute:
  echo: true
  eval: false
  warning: false
  message: false
  freeze: auto
  working-dir: .
