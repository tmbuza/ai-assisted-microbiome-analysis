project:
  type: book
  output-dir: docs
  resources:
  - results/example/figures/*.png
  - results/dietswap/figures/*.png
  - results/mouse59/figures/*.png
  - results/my-study/figures/*.png

date: 2026-10-14
date-format: MMM YYYY

book:
  title: AI-Assisted Microbiome Analysis
  subtitle: From microbiome data to an output you understand and can defend
  author: Teresia Mrema Buza | Complex Data Insights

  chapters:
  - index.qmd
  - part: Set up and run

    chapters:
    - 01-run-the-workflow.qmd

  - part: Practice with synthetic data
    chapters:
    - examples/community-comparison/00-start-here.qmd
    - examples/community-comparison/01-see-the-result.qmd
    - examples/community-comparison/02-meet-the-data.qmd
    - examples/community-comparison/03-check-the-inputs.qmd
    - examples/community-comparison/04-run-the-analysis.qmd
    - examples/community-comparison/05-verify-and-explain.qmd
    - examples/community-comparison/06-export-the-report.qmd

  - part: Follow the DietSwap study
    chapters:
    - examples/dietswap/00-start-here.qmd
    - examples/dietswap/01-see-the-result.qmd
    - examples/dietswap/02-meet-the-data.qmd
    - examples/dietswap/03-check-the-inputs.qmd
    - examples/dietswap/04-run-the-analysis.qmd
    - examples/dietswap/05-verify-and-explain.qmd
    - examples/dietswap/06-export-the-report.qmd

  - part: Explore Mouse59
    chapters:
    - examples/mouse59/00-start-here.qmd
    - examples/mouse59/01-see-the-result.qmd
    - examples/mouse59/02-meet-the-data.qmd
    - examples/mouse59/03-check-the-inputs.qmd
    - examples/mouse59/04-run-the-analysis.qmd
    - examples/mouse59/05-verify-and-explain.qmd
    - examples/mouse59/06-export-the-report.qmd

  - part: "Analyse your own data"
    chapters:
      - examples/my-study/00-start-here.qmd
      - 02-write-the-report.qmd

  appendices:
    - examples/community-comparison/99-appendix.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    number-depth: 2
    anchor-sections: true
    link-external-icon: true
    css: assets/css/cdi.css
    code-fold: true
    code-summary: Show code
    code-tools: false
    smooth-scroll: true
    mermaid:
      theme: forest

execute:
  echo: true
  eval: false
  warning: false
  message: false
  freeze: auto
  working-dir: .
